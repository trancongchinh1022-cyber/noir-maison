<script>/*! NOIR MAISON — QR + VietQR (không phụ thuộc thư viện ngoài, chạy cả khi mở file:// không có mạng)
 *  - NMQR.make(text, ecl)       → {size, get(x,y)}   (mã QR chuẩn ISO 18004, chế độ byte, ECC L/M/Q/H)
 *  - NMQR.draw(canvas, text, o) → vẽ QR lên canvas (có vùng trắng viền, tải về PNG được)
 *  - NMQR.vietqr({bin,account,amount,memo,dynamic}) → chuỗi payload VietQR (NAPAS 247, EMVCo) kèm CRC16
 *  Thuật toán dựa trên mô tả công khai của chuẩn QR (Reed-Solomon GF(256), mặt nạ 0-7, chọn mặt nạ điểm phạt thấp nhất). */

  "use strict";
  var ECC_PER_BLOCK = [
    [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
    [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30]
  ];
  var NUM_BLOCKS = [
    [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
    [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
    [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
    [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81]
  ];
  var ECL = { L: [0, 1], M: [1, 0], Q: [2, 3], H: [3, 2] }; // [索引, 格式位]

  function rawModules(ver) {
    var r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      var n = Math.floor(ver / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (ver >= 7) r -= 36;
    }
    return r;
  }
  function dataCodewords(ver, ei) { return Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ei][ver] * NUM_BLOCKS[ei][ver]; }

  // ---- GF(256) / Reed-Solomon ----
  function gfMul(x, y) { var z = 0; for (var i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 0xFF; }

    var res = []; for (var i = 0; i < deg - 1; i++) res.push(0); res.push(1);
    var root = 1;

      for (var j = 0; j < res.length; j++) { res[j] = gfMul(res[j], root); if (j + 1 < res.length) res[j] ^= res[j + 1]; }
      root = gfMul(root, 2);
    }
    return res;
  }
  function rsRemainder(data, div) {
    var res = div.map(function () { return 0; });
    data.forEach(function (b) {
      var f = b ^ res.shift(); res.push(0);

V.customers=async()=>{
 const O=ok(await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(5000)),M=new Map();

 const C=[...M.values()];let seg='',srt='spent';const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase();

 const draw=()=>{$('#sg').innerHTML=SG.map(s=>`<button class="btn s chip ${s[0]===seg?'p':''}" data-s="${s[0]}">${s[1]}</button>`).join('');$$('[data-s]').forEach(b=>b.onclick=()=>{seg=b.dataset.s;draw()});

let LV={pend:[],base:[],row:null};
const parseRepl=t=>String(t||'').split(/\r?\n/).map(l=>{const i=l.indexOf('=>');return i>0?[l.slice(0,i).trim(),l.slice(i+2).trim()]:null}).filter(p=>p&&p[0]);
function mergeRepl(pairs,old,nw){const i=pairs.findIndex(p=>p[1]===old);if(i>=0){if(pairs[i][0]===nw)pairs.splice(i,1);else pairs[i][1]=nw;return}const j=pairs.findIndex(p=>p[0]===old);if(j>=0){pairs[j][1]=nw;return}pairs.push([old,nw])}
if(!window.__lvMsg){window.__lvMsg=1;window.addEventListener('message',e=>{const d=e.data;const fr=$('#lvf');if(!d||!d.nmEdit||tab!=='live'||!fr||e.source!==fr.contentWindow)return;const old=String(d.old||'').trim(),nw=String(d.text||'').replace(/\s*\n\s*/g,' ').trim();if(!old||!nw||old===nw||nw.includes('=>'))return;const k=LV.pend.findIndex(p=>p[1]===old);if(k>=0){LV.pend[k][1]=nw}else LV.pend.push([old,nw]);lvList()})}
function lvList(){const p=$('#pd'),a=$('#ap');if(!p)return;p.innerHTML=LV.pend.map((x,i)=>`<div class="lvi"><div class="m" style="font-size:12px">${esc(x[0])}</div><b>→ ${esc(x[1])}</b><button class="btn s" data-d="${i}">✕</button></div>`).join('')||'<div class="m" style="font-size:13px">Chưa có thay đổi. Bấm vào chữ trên trang để sửa.</div>';$$('[data-d]',p).forEach(b=>b.onclick=()=>{LV.pend.splice(+b.dataset.d,1);lvList()});$('#pubn').textContent=LV.pend.length;
 a.innerHTML=LV.base.map((x,i)=>`<div class="lvi"><div class="m" style="font-size:12px">${esc(x[0])}</div><b>→ ${esc(x[1])}</b><button class="btn s" data-x="${i}" title="Bỏ thay đổi này">✕</button></div>`).join('')||'<div class="m" style="font-size:13px">Chưa có.</div>';$$('[data-x]',a).forEach(b=>b.onclick=()=>{if(!confirm('Bỏ thay đổi này và trả về chữ gốc?'))return;const nb=LV.base.filter((_,i)=>i!==+b.dataset.x);lvSave(nb,'Đã bỏ thay đổi')})}
async function lvSave(pairs,msg){await run(async()=>{const v=pairs.map(p=>p[0]+' => '+p[1]).join('\n');if(LV.row){ok(await sb.from('content_blocks').update({published_value:v,draft_value:null}).eq('key','site.replacements'))}else{ok(await sb.from('content_blocks').insert({key:'site.replacements',page:'Chung',section:'Thay chữ tuỳ ý',label:'Thay chữ tuỳ ý',kind:'lines',published_value:v,sort_order:9999}));LV.row=true}LV.base=pairs;LV.pend=[];toast(msg);lvList();const f=$('#lvf');if(f)setTimeout(()=>{f.src=f.src},400)})}

 <div class="note" style="margin-top:12px"><b>Cách dùng:</b> bấm vào <b>bất kỳ chữ nào</b> trong khung bên dưới → sửa → <b>Lưu</b>. Các thay đổi nằm ở cột “Chờ lưu”; bấm <b>Xuất bản</b> để web thật đổi theo. Đổi chữ nào thì <b>mọi chỗ có đúng đoạn chữ đó</b> đổi theo. Tên, giá, ảnh sản phẩm sửa ở mục <b>Sản phẩm</b>; ảnh/video/link sửa ở <b>Sửa web</b>.${DEMO?'<br><b>Chế độ xem thử:</b> bấm Xuất bản sẽ không lưu thật.':''}</div>
 <div class="lv"><div class="lvf" id="lvw"><iframe id="lvf" src="${base}" title="Trang bán hàng" style="width:390px;height:76vh;border:1px solid #d9d5cb;border-radius:10px;background:#000"></iframe></div>
 <div class="lvs"><div class="card"><div class="row sp"><h3 style="border:0;padding:0">Chờ lưu (<span id="pubn">0</span>)</h3><button class="btn p s" id="pub">Xuất bản</button></div><div id="pd"></div></div><div class="card"><h3>Đã áp dụng trên web</h3><div id="ap"></div></div></div></div>`);
 $$('[data-dv]').forEach(b=>b.onclick=()=>{$$('[data-dv]').forEach(x=>x.classList.toggle('p',x===b));$('#lvf').style.width=b.dataset.dv});
 $('#pub').onclick=()=>{if(!LV.pend.length)return toast('Chưa có thay đổi nào',1);if(DEMO)return toast('Chế độ xem thử: không lưu thật. Kết nối Supabase để dùng.',1);const pairs=LV.base.map(p=>[...p]);LV.pend.forEach(p=>mergeRepl(pairs,p[0],p[1]));lvSave(pairs,'Đã xuất bản — web đã đổi')};

if(!/^https?:$/.test(location.protocol)){const wb=document.createElement('div');wb.className='demo';wb.style.cssText='background:#fdeaea;border-color:#f0c2c2;color:#7a1f1f';wb.innerHTML='<b>⚠ Bạn đang mở file trực tiếp trong thiết bị.</b> Admin chưa nối được Supabase và một số mục (Sửa trực tiếp, nhận đơn) sẽ không chạy. Hãy mở bằng link <b>https://…</b> sau khi đưa web lên GitHub Pages (xem file hướng dẫn).';document.addEventListener('DOMContentLoaded',()=>document.body.prepend(wb));if(document.body)document.body.prepend(wb)}
